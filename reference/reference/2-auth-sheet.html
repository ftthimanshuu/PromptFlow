<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PromptFlow Auth</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000;color:#F5F5F7;font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
h1,p{margin:0}
.s{color:#A1A1A6}
button{font:600 14px -apple-system,system-ui,sans-serif;cursor:pointer;min-height:44px;transition:transform .3s cubic-bezier(.16,1,.3,1)}
button:active{transform:scale(.98)}
input{box-sizing:border-box;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 16px;color:#F5F5F7;font:15px -apple-system,system-ui,sans-serif}
input:focus{outline:0;border-color:#0A84FF;box-shadow:0 0 0 3px rgba(10,132,255,.2)}
label{display:block;font-size:13px;font-weight:500;margin:0 0 6px}

body{background:#05070D}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes drift{50%{transform:translate(36px,-28px) scale(1.07)}}
@keyframes ping{70%,100%{box-shadow:0 0 0 7px rgba(48,209,88,0)}}
@keyframes grow{from{transform:scaleX(0)}}
.orb{position:absolute;border-radius:50%;filter:blur(90px);z-index:-1;animation:drift 24s ease-in-out infinite}
.o1{width:520px;height:520px;left:-120px;top:-80px;background:#0A3A7A;opacity:.55}
.o2{width:480px;height:480px;right:-100px;top:34%;background:#12475C;opacity:.4;animation-delay:-8s}
.o3{width:420px;height:420px;left:30%;bottom:-120px;background:#3A2F63;opacity:.35;animation-delay:-14s}
.c,.g{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 32px rgba(0,0,0,.32);animation:rise .9s cubic-bezier(.16,1,.3,1) backwards;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.c:hover{transform:translateY(-3px)}
.c:nth-child(2),.g:nth-child(2){animation-delay:.08s}.c:nth-child(3),.g:nth-child(3){animation-delay:.16s}.c:nth-child(4){animation-delay:.24s}.c:nth-child(5){animation-delay:.32s}.c:nth-child(6){animation-delay:.4s}
h1{animation:rise 1s cubic-bezier(.16,1,.3,1) backwards}
.stp{animation:rise .8s cubic-bezier(.16,1,.3,1) backwards}.stp:nth-child(1){animation-delay:.8s}.stp:nth-child(2){animation-delay:.95s}.stp:nth-child(3){animation-delay:1.1s}.stp:nth-child(4){animation-delay:1.25s}
.col{animation:rise .9s cubic-bezier(.16,1,.3,1) backwards}.col:nth-child(2){animation-delay:.1s}.col:nth-child(3){animation-delay:.2s}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#30D158;margin-right:7px;vertical-align:1px;animation:ping 2.4s ease-out infinite}
button{transition:transform .35s cubic-bezier(.16,1,.3,1),filter .3s}
button:hover{filter:brightness(1.14)}button:active{transform:scale(.97)}
.bl{background:rgba(10,113,227,.88)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sg{position:relative;display:inline-flex;box-sizing:border-box;padding:3px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.sg input{position:absolute;opacity:0;width:1px;height:1px}
.sg label{flex:1;position:relative;z-index:1;text-align:center;padding:8px 14px;font:600 13px -apple-system,system-ui,sans-serif;color:#A1A1A6;cursor:pointer;transition:color .3s;white-space:nowrap}
.sg input:checked+label{color:#F5F5F7}
.sg input:focus-visible+label{outline:2px solid #0A84FF;border-radius:10px}
.pl{position:absolute;top:3px;bottom:3px;left:3px;border-radius:10px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 8px rgba(0,0,0,.25);transition:transform .55s cubic-bezier(.16,1,.3,1)}
.n2 .pl{width:calc((100% - 6px)/2)}.n3 .pl{width:calc((100% - 6px)/3)}
.sg input:nth-of-type(2):checked~.pl{transform:translateX(100%)}
.sg input:nth-of-type(3):checked~.pl{transform:translateX(200%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:relative;isolation:isolate;overflow:hidden;width:520px;height:680px;box-sizing:border-box;padding:32px;background:#05070D;display:flex;align-items:center;justify-content:center"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 32px rgba(0,0,0,.35)">
<h1 style="font-size:24px;font-weight:600;letter-spacing:-.02em">Welcome to PromptFlow</h1>
<p class="s" style="margin:4px 0 20px">Sign in to manage your automations.</p>
<div class="sg n2" style="display:flex;width:100%;margin-bottom:20px"><input type="radio" name="au" id="au1" checked><label for="au1">Sign In</label><input type="radio" name="au" id="au2"><label for="au2">Create Account</label><i class="pl"></i></div>
<button style="width:100%;border-radius:12px;background:#000;color:#F5F5F7;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;gap:10px">
<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
Continue with Google</button>
<p class="s" style="text-align:center;font-size:12px;margin:16px 0">or use email</p>
<label for="e">Email</label><input id="e" type="email" value="name@example.com">
<label for="p" style="margin-top:14px">Password</label><input id="p" type="password" value="••••••••••">
<p style="margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(255,69,58,.12);color:#FF453A;font-size:13px">Incorrect email or password. Please try again.</p>
<button style="width:100%;margin-top:16px;border-radius:12px;background:#0071E3;color:#fff;border:0">Sign In</button>
<p class="s" style="margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px">Need alerts? <a href="#" style="color:#0A84FF;text-decoration:none">Open the Channel Setup Guide →</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":680}}'>

}
</script>
</body>
</html>
